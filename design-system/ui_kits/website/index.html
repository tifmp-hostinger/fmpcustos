<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Website" name="Website — Marketing Home (v1, alternativa)" subtitle="Composição-conceito anterior; a referência canônica é a Home (fmp.edu.br)" viewport="1280x820" -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FMP — Graduação em Direito</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--fmp-cream); }
  #scroll-root { height: 100vh; overflow-y: auto; }
  ::-webkit-scrollbar { width: 11px; }
  ::-webkit-scrollbar-thumb { background: var(--fmp-line-2); border-radius: 99px; border: 3px solid var(--fmp-cream); }
  /* modal */
  .ov { position: fixed; inset: 0; background: rgba(13,11,12,.55); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; animation: fade .2s var(--ease); }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Shared.jsx"></script>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Courses.jsx"></script>
<script type="text/babel" src="Prestige.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
const { useState } = React;

function EnrollModal({ onClose }) {
  const [step, setStep] = useState(0);
  const [data, setData] = useState({ name: '', email: '', course: 'Graduação em Direito' });
  const field = (label, key, type='text', ph='') => (
    <div style={{ marginBottom: 16 }}>
      <label style={{ display: 'block', fontFamily: 'var(--font-sans)', fontSize: 12, fontWeight: 600, color: 'var(--fmp-ink-2)', marginBottom: 6 }}>{label}</label>
      <input value={data[key]} type={type} placeholder={ph} onChange={e => setData({ ...data, [key]: e.target.value })}
        style={{ width: '100%', boxSizing: 'border-box', fontFamily: 'var(--font-sans)', fontSize: 15, padding: '13px 15px', border: '1.5px solid var(--fmp-line)', borderRadius: 10, background: '#fff', color: 'var(--fmp-black)', outline: 'none' }}
        onFocus={e => { e.target.style.borderColor = 'var(--fmp-red)'; e.target.style.boxShadow = '0 0 0 3px var(--fmp-red-tint)'; }}
        onBlur={e => { e.target.style.borderColor = 'var(--fmp-line)'; e.target.style.boxShadow = 'none'; }} />
    </div>
  );
  return (
    <div className="ov" onClick={onClose}>
      <div onClick={e => e.stopPropagation()} style={{ width: 460, maxWidth: '100%', background: 'var(--fmp-cream)', borderRadius: 28, padding: '34px 34px 30px', position: 'relative', animation: 'rise .26s var(--ease)', boxShadow: 'var(--shadow-lg)' }}>
        <button onClick={onClose} style={{ position: 'absolute', top: 20, right: 20, background: 'transparent', border: 0, cursor: 'pointer', color: 'var(--fmp-ink-3)' }}><Icon name="close" size={22} /></button>
        {step === 0 ? <>
          <Sparkle variant="red" size={34} />
          <h3 style={{ fontFamily: 'var(--font-display)', fontStyle: 'italic', fontWeight: 600, fontSize: 30, margin: '14px 0 4px', color: 'var(--fmp-black)' }}>Vestibular <span style={{ color: 'var(--fmp-red)' }}>2026</span></h3>
          <p style={{ fontFamily: 'var(--font-sans)', fontSize: 14.5, color: 'var(--fmp-ink-2)', margin: '0 0 24px' }}>Comece sua inscrição. Leva menos de um minuto.</p>
          {field('Nome completo', 'name', 'text', 'Seu nome')}
          {field('E-mail', 'email', 'email', 'voce@exemplo.com.br')}
          <Button style={{ width: '100%', justifyContent: 'center', marginTop: 6 }} size="lg" onClick={() => setStep(1)}>Continuar <Icon name="arrow" size={18} color="#fff" /></Button>
        </> : <div style={{ textAlign: 'center', padding: '10px 0' }}>
          <div style={{ width: 58, height: 58, borderRadius: '50%', background: 'var(--fmp-red)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 18px' }}><Icon name="check" size={30} color="#fff" stroke={2.6} /></div>
          <h3 style={{ fontFamily: 'var(--font-display)', fontStyle: 'italic', fontWeight: 600, fontSize: 26, margin: '0 0 8px', color: 'var(--fmp-black)' }}>Inscrição iniciada!</h3>
          <p style={{ fontFamily: 'var(--font-sans)', fontSize: 14.5, color: 'var(--fmp-ink-2)', margin: '0 0 22px' }}>Enviamos os próximos passos para <strong>{data.email || 'seu e-mail'}</strong>. Bem-vindo à casa de quem faz Direito.</p>
          <Button style={{ justifyContent: 'center' }} onClick={onClose}>Fechar</Button>
        </div>}
      </div>
    </div>
  );
}

function Oab() {
  return (
    <section style={{ background: '#0D0B0C', position: 'relative', overflow: 'hidden', padding: '90px 0' }}>
      <svg viewBox="0 0 1440 500" preserveAspectRatio="none" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }} aria-hidden="true"><path d="M-40 520 A 620 620 0 0 1 560 -40" fill="none" stroke="rgba(238,42,66,.35)" strokeWidth="1.5"/></svg>
      <div style={{ maxWidth: 1240, margin: '0 auto', padding: '0 48px', position: 'relative', display: 'grid', gridTemplateColumns: '1fr 1.2fr', gap: 64, alignItems: 'center' }}>
        <div style={{ position: 'relative', height: 300, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <span style={{ fontFamily: 'var(--font-display)', fontStyle: 'italic', fontWeight: 700, fontSize: 300, color: 'var(--fmp-red)', lineHeight: .8 }}>4</span>
          <span style={{ fontFamily: 'var(--font-display)', fontStyle: 'italic', fontWeight: 700, fontSize: 190, color: 'var(--fmp-red)', lineHeight: .8, alignSelf: 'flex-end', marginLeft: -10 }}>x</span>
          <img src="../../assets/selo-oab.png" alt="OAB Recomenda" style={{ position: 'absolute', top: '50%', left: '50%', transform: 'translate(10%, -60%)', height: 130 }} />
        </div>
        <div>
          <h2 style={{ fontFamily: 'var(--font-display)', fontStyle: 'italic', fontWeight: 700, fontSize: 46, lineHeight: 1.02, color: 'var(--fmp-red)', margin: 0 }}>Selo OAB Recomenda</h2>
          <p style={{ fontFamily: 'var(--font-sans)', fontSize: 17, lineHeight: 1.65, color: 'var(--fmp-cream)', margin: '20px 0 0', maxWidth: 540 }}>
            A FMP é a única Faculdade Privada do Estado a contar com o selo OAB Recomenda por quatro vezes consecutivas — a maior distinção de qualidade de ensino para cursos de graduação em Direito no país.
          </p>
          <a href="#" style={{ display: 'inline-block', marginTop: 26, fontFamily: 'var(--font-sans)', fontSize: 15, fontWeight: 600, color: 'var(--fmp-cream)', textDecoration: 'underline', textUnderlineOffset: 4, textDecorationThickness: '1.5px' }}>Veja nossos reconhecimentos</a>
        </div>
      </div>
    </section>
  );
}

function App() {
  const [modal, setModal] = useState(false);
  const open = () => setModal(true);
  return (
    <div className="fmp" id="scroll-root">
      <Header onCTA={open} />
      <Hero onCTA={open} />
      <Courses />
      <Oab />
      <Prestige onCTA={open} />
      <Footer />
      {modal && <EnrollModal onClose={() => setModal(false)} />}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
