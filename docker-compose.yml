# Ambiente local. Em produção o EasyPanel provisiona o Postgres como serviço
# próprio e constrói a aplicação a partir do Dockerfile.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fmpcustos
      POSTGRES_PASSWORD: fmpcustos
      POSTGRES_DB: fmpcustos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fmpcustos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fmpcustos:fmpcustos@db:5432/fmpcustos?schema=public
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
